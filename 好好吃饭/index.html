<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EatPlan - 智能饮食规划器</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                "Microsoft YaHei",
                "PingFang SC",
                Arial,
                sans-serif;

            background: #f5f7f5;
            color: #27342d;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(
                135deg,
                #507a61,
                #82a98b
            );

            color: white;

            padding: 45px 20px 70px;

            text-align: center;
        }

        header h1 {
            font-size: 36px;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .container {
            max-width: 1100px;
            margin: -35px auto 50px;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 22px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.06);
        }

        .card-title {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 22px;

            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title span {
            color: #5b8b6b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #59635d;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #dce3de;
            border-radius: 10px;

            outline: none;

            font-size: 15px;

            background: white;

            transition: 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #6d9b7a;

            box-shadow:
                0 0 0 3px
                rgba(109,155,122,0.12);
        }

        .radio-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .radio-option {
            flex: 1;
            min-width: 100px;
        }

        .radio-option input {
            display: none;
        }

        .radio-option label {
            display: block;

            text-align: center;

            padding: 13px 10px;

            border: 1px solid #dce3de;
            border-radius: 10px;

            cursor: pointer;

            font-weight: normal;

            transition: 0.2s;
        }

        .radio-option input:checked + label {
            background: #e9f3eb;
            border-color: #6d9b7a;
            color: #42684d;
            font-weight: bold;
        }

        .full {
            grid-column: 1 / -1;
        }

        .calculate-btn {
            width: 100%;

            border: none;

            padding: 16px;

            border-radius: 12px;

            background: #5c896a;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 22px;

            transition: 0.2s;
        }

        .calculate-btn:hover {
            background: #4c7659;
            transform: translateY(-1px);
        }

        .result {
            display: none;
        }

        .result.show {
            display: block;
        }

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 14px;
        }

        .stat {
            background: #f5f8f5;

            border-radius: 14px;

            padding: 20px;

            text-align: center;
        }

        .stat .number {
            font-size: 28px;

            font-weight: bold;

            color: #4f7d5e;

            margin: 7px 0;
        }

        .stat .unit {
            font-size: 13px;
            color: #7b857e;
        }

        .macro-container {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-top: 18px;
        }

        .macro {
            border-radius: 14px;

            padding: 18px;

            background: #f7f8f7;
        }

        .macro-title {
            color: #66716a;
            font-size: 14px;
        }

        .macro-value {
            font-size: 24px;

            font-weight: bold;

            margin-top: 5px;
        }

        /* ==============================
           菜单
        ============================== */

        .meal-list {
            display: grid;
            gap: 20px;
        }

        .meal {
            border: 1px solid #e2e8e3;

            border-radius: 16px;

            padding: 20px;

            background: white;
        }

        .meal-header {
            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 18px;
        }

        .meal-name {
            font-size: 20px;
            font-weight: bold;
        }

        .meal-calorie {
            color: #5b8968;
            font-weight: bold;
        }

        .food-list {
            display: grid;
            gap: 10px;
        }

        .food-item {
            background: #f7f9f7;

            padding: 14px 16px;

            border-radius: 11px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;
        }

        .food-main {
            display: flex;

            flex-direction: column;

            gap: 5px;
        }

        .food-name {
            font-size: 15px;
            font-weight: bold;
        }

        .food-amount {
            font-size: 13px;
            color: #607068;
        }

        .food-calorie {
            font-size: 13px;

            color: #7b857e;

            white-space: nowrap;
        }

        .meal-note {
            margin-top: 15px;

            font-size: 13px;

            color: #7c867f;

            line-height: 1.6;

            background: #f4f7f4;

            padding: 10px 12px;

            border-radius: 8px;
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .secondary-btn {
            flex: 1;

            border:
                1px solid #6d9b7a;

            color: #50755b;

            background: white;

            padding: 13px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;
        }

        .secondary-btn:hover {
            background: #f1f7f2;
        }

        .tip {
            background: #f0f6f1;

            border-left:
                4px solid #6b9777;

            padding: 15px 17px;

            border-radius: 8px;

            margin-top: 20px;

            line-height: 1.7;

            font-size: 14px;

            color: #526158;
        }

        .warning {
            background: #fff8eb;

            border-left:
                4px solid #e2a84b;

            padding: 15px 17px;

            border-radius: 8px;

            margin-top: 20px;

            line-height: 1.7;

            font-size: 14px;

            color: #765d31;
        }

        .bmi-status {
            display: inline-block;

            padding: 4px 10px;

            border-radius: 20px;

            background: #edf5ee;

            color: #52775b;

            font-size: 13px;

            margin-top: 5px;
        }

        footer {
            text-align: center;

            color: #8b948e;

            font-size: 13px;

            padding: 10px 20px 35px;
        }

        @media (max-width: 800px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

        }

        @media (max-width: 550px) {

            header h1 {
                font-size: 28px;
            }

            .card {
                padding: 20px;
            }

            .macro-container {
                grid-template-columns: 1fr;
            }

            .food-item {
                align-items: flex-start;
            }

            .meal-header {
                align-items: flex-start;
                gap: 10px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>EatPlan</h1>

    <p>
        根据你的身体数据，生成更适合你的每日饮食方案
    </p>

</header>


<div class="container">


    <!-- ==============================
         基础信息
    =============================== -->

    <div class="card">

        <div class="card-title">
            <span>01</span>
            基础信息
        </div>


        <div class="form-grid">


            <div class="form-group">

                <label>性别</label>

                <div class="radio-group">

                    <div class="radio-option">

                        <input
                            type="radio"
                            name="gender"
                            id="male"
                            value="male"
                            checked
                        >

                        <label for="male">
                            男性
                        </label>

                    </div>


                    <div class="radio-option">

                        <input
                            type="radio"
                            name="gender"
                            id="female"
                            value="female"
                        >

                        <label for="female">
                            女性
                        </label>

                    </div>

                </div>

            </div>


            <div class="form-group">

                <label for="age">
                    年龄
                </label>

                <input
                    type="number"
                    id="age"
                    placeholder="例如：22"
                    min="14"
                    max="100"
                >

            </div>


            <div class="form-group">

                <label for="height">
                    身高（cm）
                </label>

                <input
                    type="number"
                    id="height"
                    placeholder="例如：175"
                    min="100"
                    max="250"
                >

            </div>


            <div class="form-group">

                <label for="weight">
                    体重（kg）
                </label>

                <input
                    type="number"
                    id="weight"
                    placeholder="例如：65"
                    min="25"
                    max="300"
                >

            </div>


            <div class="form-group full">

                <label for="activity">
                    日常活动水平
                </label>

                <select id="activity">

                    <option value="1.2">
                        久坐型：很少运动
                    </option>

                    <option value="1.375">
                        轻度活动：每周运动 1～3 次
                    </option>

                    <option value="1.55" selected>
                        中度活动：每周运动 3～5 次
                    </option>

                    <option value="1.725">
                        高度活动：每周运动 6～7 次
                    </option>

                    <option value="1.9">
                        极高活动：体力劳动/高强度训练
                    </option>

                </select>

            </div>

        </div>

    </div>


    <!-- ==============================
         饮食需求
    =============================== -->

    <div class="card">

        <div class="card-title">

            <span>02</span>

            你的饮食需求

        </div>


        <div class="form-grid">


            <div class="form-group">

                <label>
                    身体目标
                </label>

                <select id="goal">

                    <option value="maintain">
                        维持体重
                    </option>

                    <option value="lose">
                        减肥 / 减脂
                    </option>

                    <option value="gain">
                        增肌 / 增重
                    </option>

                    <option value="health">
                        养身体 / 健康饮食
                    </option>

                    <option value="recovery">
                        生病 / 恢复期
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    每天吃几餐
                </label>

                <div class="radio-group">

                    <div class="radio-option">

                        <input
                            type="radio"
                            name="mealCount"
                            id="meal2"
                            value="2"
                        >

                        <label for="meal2">
                            2 餐
                        </label>

                    </div>


                    <div class="radio-option">

                        <input
                            type="radio"
                            name="mealCount"
                            id="meal3"
                            value="3"
                            checked
                        >

                        <label for="meal3">
                            3 餐
                        </label>

                    </div>

                </div>

            </div>


            <div class="form-group full">

                <label>
                    饮食条件
                </label>

                <select id="foodType">

                    <option value="cook">
                        自己做饭
                    </option>

                    <option value="takeout">
                        外卖 / 点餐
                    </option>

                    <option value="both">
                        做饭 + 外卖都可以
                    </option>

                </select>

            </div>

        </div>


        <button
            class="calculate-btn"
            onclick="calculate()"
        >

            生成我的饮食方案

        </button>

    </div>


    <!-- ==============================
         结果
    =============================== -->

    <div
        id="result"
        class="result"
    >


        <div class="card">

            <div class="card-title">

                <span>03</span>

                你的每日能量需求

            </div>


            <div class="stats">


                <div class="stat">

                    <div>BMI</div>

                    <div
                        class="number"
                        id="bmi"
                    >
                        -
                    </div>

                    <div
                        class="bmi-status"
                        id="bmiStatus"
                    >
                        -
                    </div>

                </div>


                <div class="stat">

                    <div>基础代谢</div>

                    <div
                        class="number"
                        id="bmr"
                    >
                        -
                    </div>

                    <div class="unit">
                        kcal / 天
                    </div>

                </div>


                <div class="stat">

                    <div>每日消耗</div>

                    <div
                        class="number"
                        id="tdee"
                    >
                        -
                    </div>

                    <div class="unit">
                        kcal / 天
                    </div>

                </div>


                <div class="stat">

                    <div>建议摄入</div>

                    <div
                        class="number"
                        id="targetCalories"
                    >
                        -
                    </div>

                    <div class="unit">
                        kcal / 天
                    </div>

                </div>

            </div>


            <div class="macro-container">


                <div class="macro">

                    <div class="macro-title">
                        蛋白质
                    </div>

                    <div
                        class="macro-value"
                        id="protein"
                    >
                        -
                    </div>

                    <div class="unit">
                        g / 天
                    </div>

                </div>


                <div class="macro">

                    <div class="macro-title">
                        碳水化合物
                    </div>

                    <div
                        class="macro-value"
                        id="carbs"
                    >
                        -
                    </div>

                    <div class="unit">
                        g / 天
                    </div>

                </div>


                <div class="macro">

                    <div class="macro-title">
                        脂肪
                    </div>

                    <div
                        class="macro-value"
                        id="fat"
                    >
                        -
                    </div>

                    <div class="unit">
                        g / 天
                    </div>

                </div>

            </div>

        </div>


        <!-- 菜单 -->

        <div class="card">

            <div class="card-title">

                <span>04</span>

                今日推荐菜单

            </div>


            <div
                class="meal-list"
                id="mealList"
            ></div>


            <div class="button-row">

                <button
                    class="secondary-btn"
                    onclick="generateMenu()"
                >

                    🔄 换一套菜单

                </button>

            </div>


            <div
                class="tip"
                id="tip"
            ></div>


            <div
                class="warning"
                id="warning"
                style="display:none"
            ></div>

        </div>

    </div>

</div>


<footer>

    EatPlan · 仅用于一般营养估算与饮食规划，
    不构成医疗诊断或治疗建议

</footer>

/* =====================================================
   随机选择
   ===================================================== */

function randomItem(array) {

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}



/* =====================================================
   计算 BMI
   ===================================================== */

function calculateBMI(height, weight) {

    const heightMeter =
        height / 100;

    return (
        weight /
        (heightMeter * heightMeter)
    );

}


function getBMIStatus(bmi) {

    if (bmi < 18.5) {

        return "偏瘦";

    }

    if (bmi < 24) {

        return "正常";

    }

    if (bmi < 28) {

        return "偏胖";

    }

    return "肥胖";

}



/* =====================================================
   生成生活化份量
   ===================================================== */

function getAmount(
    foodKey,
    multiplier
) {

    const food =
        foodDB[foodKey];

    const amount =
        Math.round(
            food.base *
            multiplier
        );


    let unit =
        food.unit;


    /*
    根据重量进一步调整描述
    */

    if (
        foodKey === "rice" ||
        foodKey === "brownRice"
    ) {

        if (amount >= 230) {

            unit = "约1大碗";

        }
        else if (amount >= 170) {

            unit = "约1小碗";

        }
        else {

            unit = "约半碗";

        }

    }


    if (foodKey === "chicken") {

        if (amount >= 200) {

            unit =
                "约1.5个手掌大";

        }
        else {

            unit =
                "约1个手掌大";

        }

    }


    if (foodKey === "beef") {

        if (amount >= 170) {

            unit =
                "约1.5个手掌大";

        }
        else {

            unit =
                "约1个手掌大";

        }

    }


    if (
        foodKey === "broccoli" ||
        foodKey === "spinach" ||
        foodKey === "vegetables"
    ) {

        if (amount >= 250) {

            unit =
                "约2～3拳头";

        }
        else {

            unit =
                "约2拳头";

        }

    }


    return (
        amount +
        "g（" +
        unit +
        "）"
    );

}



/* =====================================================
   创建一顿饭
   ===================================================== */

function createMeal(
    foodKeys,
    multiplier
) {

    const foods = [];

    let totalCalories = 0;


    foodKeys.forEach(
        function(foodKey) {

            const food =
                foodDB[foodKey];


            /*
            防止数据库缺少食物导致
            整个菜单崩溃
            */

            if (!food) {

                console.error(
                    "找不到食物：",
                    foodKey
                );

                return;

            }


            const amount =
                Math.round(
                    food.base *
                    multiplier
                );


            const calories =
                Math.round(
                    food.calorie *
                    amount /
                    100
                );


            totalCalories +=
                calories;


            foods.push({

                name:
                    food.name,

                amount:
                    getAmount(
                        foodKey,
                        multiplier
                    ),

                calories:
                    calories

            });

        }
    );


    return {

        foods:
            foods,

        totalCalories:
            totalCalories

    };

}



/* =====================================================
   主计算
   ===================================================== */

function calculate() {

    const gender =
        document.querySelector(
            'input[name="gender"]:checked'
        ).value;


    const age =
        Number(
            document.getElementById(
                "age"
            ).value
        );


    const height =
        Number(
            document.getElementById(
                "height"
            ).value
        );


    const weight =
        Number(
            document.getElementById(
                "weight"
            ).value
        );


    const activity =
        Number(
            document.getElementById(
                "activity"
            ).value
        );


    const goal =
        document.getElementById(
            "goal"
        ).value;


    if (
        !age ||
        !height ||
        !weight
    ) {

        alert(
            "请完整填写年龄、身高和体重。"
        );

        return;

    }


    /* =========================
       BMR
    ========================= */

    let bmr;


    if (gender === "male") {

        bmr =
            10 * weight +
            6.25 * height -
            5 * age +
            5;

    }
    else {

        bmr =
            10 * weight +
            6.25 * height -
            5 * age -
            161;

    }


    /* =========================
       TDEE
    ========================= */

    const tdee =
        bmr *
        activity;


    /* =========================
       目标热量
    ========================= */

    let target =
        tdee;


    if (goal === "lose") {

        target =
            tdee * 0.8;

    }


    if (goal === "gain") {

        target =
            tdee * 1.1;

    }


    if (goal === "health") {

        target =
            tdee;

    }


    if (goal === "recovery") {

        target =
            tdee;

    }


    /* 减脂最低值保护 */

    if (goal === "lose") {

        const minimum =
            gender === "male"
                ? 1500
                : 1200;


        target =
            Math.max(
                target,
                minimum
            );

    }


    /* =========================
       BMI
    ========================= */

    const bmi =
        calculateBMI(
            height,
            weight
        );


    /* =========================
       三大营养素
    ========================= */

    let proteinRatio = 0.25;

    let carbRatio = 0.50;

    let fatRatio = 0.25;


    if (goal === "lose") {

        proteinRatio = 0.30;

        carbRatio = 0.45;

        fatRatio = 0.25;

    }


    const protein =
        target *
        proteinRatio /
        4;


    const carbs =
        target *
        carbRatio /
        4;


    const fat =
        target *
        fatRatio /
        9;


    /* =========================
       保存当前数据
    ========================= */

    window.currentData = {

        gender:
            gender,

        age:
            age,

        height:
            height,

        weight:
            weight,

        goal:
            goal,

        target:
            target,

        tdee:
            tdee,

        bmi:
            bmi

    };


    /* =========================
       显示结果
    ========================= */

    document.getElementById(
        "bmi"
    ).textContent =
        bmi.toFixed(1);


    document.getElementById(
        "bmiStatus"
    ).textContent =
        getBMIStatus(bmi);


    document.getElementById(
        "bmr"
    ).textContent =
        Math.round(bmr);


    document.getElementById(
        "tdee"
    ).textContent =
        Math.round(tdee);


    document.getElementById(
        "targetCalories"
    ).textContent =
        Math.round(target);


    document.getElementById(
        "protein"
    ).textContent =
        Math.round(protein);


    document.getElementById(
        "carbs"
    ).textContent =
        Math.round(carbs);


    document.getElementById(
        "fat"
    ).textContent =
        Math.round(fat);


    document.getElementById(
        "result"
    ).classList.add("show");


    /* 生成菜单 */

    generateMenu();


    /* 生成提示 */

    generateTip();


    /* 滚动到结果 */

    setTimeout(
        function() {

            document.getElementById(
                "result"
            ).scrollIntoView({
                behavior: "smooth"
            });

        },
        100
    );

}



/* =====================================================
   生成菜单
   ===================================================== */

function generateMenu() {

    /*
    如果用户还没有计算
    不生成菜单
    */

    if (
        !window.currentData ||
        !window.currentData.target
    ) {

        return;

    }


    const mealCount =
        Number(
            document.querySelector(
                'input[name="mealCount"]:checked'
            ).value
        );


    let foodType =
        document.getElementById(
            "foodType"
        ).value;


    /*
    做饭 + 外卖
    随机选择
    */

    if (foodType === "both") {

        foodType =
            Math.random() > 0.5
                ? "cook"
                : "takeout";

    }


    const database =
        menuTemplates[
            foodType
        ];


    /*
    根据每日目标热量
    调整菜单份量

    这里以 1700 kcal
    作为基础菜单参考
    */

    const target =
        window.currentData.target;


    let multiplier =
        target / 1700;


    /*
    避免出现非常离谱的份量
    */

    multiplier =
        Math.max(
            0.75,
            Math.min(
                multiplier,
                1.35
            )
        );


    const meals = [];


    /* =========================
       3餐
    ========================= */

    if (mealCount === 3) {

        meals.push({

            name:
                "早餐",

            meal:
                createMeal(
                    randomItem(
                        database.breakfast
                    ),

                    multiplier
                )

        });


        meals.push({

            name:
                "午餐",

            meal:
                createMeal(
                    randomItem(
                        database.lunch
                    ),

                    multiplier
                )

        });


        meals.push({

            name:
                "晚餐",

            meal:
                createMeal(
                    randomItem(
                        database.dinner
                    ),

                    multiplier
                )

        });

    }


    /* =========================
       2餐
    ========================= */

    else {

        meals.push({

            name:
                "第一餐",

            meal:
                createMeal(
                    randomItem(
                        database.lunch
                    ),

                    multiplier * 1.2
                )

        });


        meals.push({

            name:
                "第二餐",

            meal:
                createMeal(
                    randomItem(
                        database.dinner
                    ),

                    multiplier * 1.2
                )

        });

    }


    renderMeals(meals);

}



/* =====================================================
   显示菜单
   ===================================================== */

function renderMeals(meals) {

    const container =
        document.getElementById(
            "mealList"
        );


    container.innerHTML = "";


    meals.forEach(
        function(item) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "meal";


            let html = `

                <div class="meal-header">

                    <div class="meal-name">

                        ${item.name}

                    </div>


                    <div class="meal-calorie">

                        约 ${item.meal.totalCalories} kcal

                    </div>

                </div>


                <div class="food-list">

            `;


            item.meal.foods.forEach(
                function(food) {

                    html += `

                        <div class="food-item">

                            <div class="food-main">

                                <div class="food-name">

                                    ${food.name}

                                </div>


                                <div class="food-amount">

                                    ${food.amount}

                                </div>

                            </div>


                            <div class="food-calorie">

                                ${food.calories} kcal

                            </div>

                        </div>

                    `;

                }
            );


            html += `

                </div>


                <div class="meal-note">

                    💡 份量估算：
                    一拳头≈一份主食或蔬菜；
                    一掌心≈一份肉类。
                    如果家里有厨房秤，优先按照克数称量。

                </div>

            `;


            div.innerHTML =
                html;


            container.appendChild(
                div
            );

        }
    );

}



/* =====================================================
   饮食建议
   ===================================================== */

function generateTip() {

    const goal =
        window.currentData.goal;


    const tip =
        document.getElementById(
            "tip"
        );


    const warning =
        document.getElementById(
            "warning"
        );


    warning.style.display =
        "none";


    if (goal === "lose") {

        tip.innerHTML =

            "减脂期间建议优先保证蛋白质和蔬菜摄入。主食不需要完全戒掉，可以通过控制米饭、面食等高能量食物的份量来制造适度热量缺口。";

    }

    else if (goal === "gain") {

        tip.innerHTML =

            "增肌期间建议保证充足蛋白质、碳水和总能量，并配合规律力量训练。";

    }

    else if (goal === "health") {

        tip.innerHTML =

            "健康饮食建议保持食物多样化。可以参考「一拳头主食 + 一掌心蛋白质 + 两拳头蔬菜」的简单搭配方式。";

    }

    else if (goal === "recovery") {

        tip.innerHTML =

            "恢复期饮食需要结合具体疾病、治疗方式、食欲以及消化吸收情况进行调整。本方案只提供普通均衡饮食思路。";


        warning.style.display =
            "block";


        warning.innerHTML =

            "<strong>⚠ 注意：</strong> 如果正在生病、术后恢复，或存在糖尿病、肾脏疾病、肝病、胃肠疾病等情况，不建议仅根据本网页自行制定治疗性饮食，应遵循专业医疗建议。";

    }

    else {

        tip.innerHTML =

            "当前菜单按照你的每日能量需求进行估算。克数适合使用厨房秤测量；没有秤时，可以参考拳头、掌心等生活化份量。";

    }

}
